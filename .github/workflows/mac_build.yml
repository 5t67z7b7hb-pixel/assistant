name: Build Production Apps

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller -y LightningAssistant.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dist\installer.iss'

      - name: Archive Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: dist/Output/AIInterviewHelperSetup.exe

      - name: Archive Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable-Build
          path: dist/LightningAssistant/

  build-macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller -y LightningAssistant.spec

      - name: Archive macOS Build
        run: ditto -c -k --sequesterRsrc --keepParent dist/LightningAssistant LightningAssistant-macOS-Portable.zip

      - name: Upload macOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Portable-Build
          path: LightningAssistant-macOS-Portable.zip