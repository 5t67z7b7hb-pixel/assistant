name: Build Production Apps

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller pywebview requests dodopayments

      - name: Build Windows Executable
        run: |
          pyinstaller -y --noconsole --onedir --name="LightningAssistant" main.py

      - name: Archive Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable-Build
          path: dist/LightningAssistant/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller pywebview requests dodopayments

      - name: Build macOS App Bundle
        run: |
          pyinstaller -y --noconsole --onedir --name="LightningAssistant" main.py

      - name: Archive macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Portable-Build
          path: dist/LightningAssistant/