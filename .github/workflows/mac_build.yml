name: Build macOS Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build macOS App Bundle
      run: python build_mac.py

    - name: Compress App for Web Download
      run: |
        cd dist
        zip -r VoiceAssistantSetup-macOS.zip VoiceAssistantSetup.app

    - name: Upload macOS Zip Artifact
      uses: actions/upload-artifact@v3
      with:
        name: macOS-Setup-Zip
        path: dist/VoiceAssistantSetup-macOS.zip